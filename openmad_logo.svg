<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    @keyframes node-pulse {
      0%, 100% { filter: drop-shadow(0 0 2px var(--glow-color)); }
      50% { filter: drop-shadow(0 0 10px var(--glow-color)); }
    }

    .orbit-outer {
      transform-origin: 250px 250px;
      animation: spin 30s linear infinite;
    }
    .orbit-inner {
      transform-origin: 250px 250px;
      animation: spin-reverse 20s linear infinite;
    }
    .core-node {
      transform-origin: 250px 250px;
      animation: pulse 4s ease-in-out infinite;
    }
    .conn-line {
      stroke-dasharray: 8 4;
      animation: dash 2s linear infinite;
    }
    .node-ba { --glow-color: #3b82f6; animation: node-pulse 3s ease-in-out infinite; }
    .node-pm { --glow-color: #a855f7; animation: node-pulse 3.5s ease-in-out infinite; }
    .node-arch { --glow-color: #06b6d4; animation: node-pulse 2.8s ease-in-out infinite; }
    .node-dev { --glow-color: #10b981; animation: node-pulse 3.2s ease-in-out infinite; }
    .node-qa { --glow-color: #f97316; animation: node-pulse 4s ease-in-out infinite; }
    .node-dep { --glow-color: #ec4899; animation: node-pulse 2.5s ease-in-out infinite; }

    /* Modern Text Styling */
    .brand-title {
      font-family: 'Outfit', 'Inter', 'system-ui', -apple-system, sans-serif;
      font-weight: 800;
      font-size: 72px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .brand-subtitle {
      font-family: 'Inter', 'system-ui', -apple-system, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
      letter-spacing: 7px;
    }
    .brand-tagline {
      font-family: 'Inter', 'system-ui', -apple-system, sans-serif;
      font-weight: 400;
      font-size: 13px;
      fill: #64748b;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Glowing background behind graphic -->
  <circle cx="250" cy="250" r="180" fill="url(#glow)" />

  <!-- Connecting lines (agent coordination) -->
  <g stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5">
    <!-- Center to peripheral nodes -->
    <line x1="250" y1="250" x2="250" y2="100" class="conn-line" />
    <line x1="250" y1="250" x2="380" y2="175" class="conn-line" />
    <line x1="250" y1="250" x2="380" y2="325" class="conn-line" />
    <line x1="250" y1="250" x2="250" y2="400" class="conn-line" stroke="#ec4899" />
    <line x1="250" y1="250" x2="120" y2="325" class="conn-line" />
    <line x1="250" y1="250" x2="120" y2="175" class="conn-line" />
    <!-- Peripheral connections (ring) -->
    <polygon points="250,100 380,175 380,325 250,400 120,325 120,175" fill="none" stroke="#64748b" stroke-opacity="0.15" stroke-dasharray="5 5" />
  </g>

  <!-- Animated Outer Orbiting Rings -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="url(#blue-grad)" stroke-width="1" stroke-dasharray="100 80" class="orbit-outer" />
  <circle cx="250" cy="250" r="165" fill="none" stroke="url(#purple-grad)" stroke-width="0.75" stroke-dasharray="50 150" class="orbit-inner" />

  <!-- Peripheral Agent Nodes -->
  <!-- BA (Mary) - Top -->
  <g class="node-ba">
    <circle cx="250" cy="100" r="16" fill="url(#blue-grad)" />
    <circle cx="250" cy="100" r="22" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="250" y="70" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#3b82f6" text-anchor="middle">RESEARCH</text>
  </g>

  <!-- PM (John) - Top Right -->
  <g class="node-pm">
    <circle cx="380" cy="175" r="16" fill="url(#purple-grad)" />
    <circle cx="380" cy="175" r="22" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="415" y="179" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#a855f7" text-anchor="start">PLANNING</text>
  </g>

  <!-- Architect (Winston) - Bottom Right -->
  <g class="node-arch">
    <circle cx="380" cy="325" r="16" fill="url(#cyan-grad)" />
    <circle cx="380" cy="325" r="22" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="415" y="329" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#06b6d4" text-anchor="start">ARCHITECTURE</text>
  </g>

  <!-- Deployer (DepBot) - Bottom -->
  <g class="node-dep">
    <circle cx="250" cy="400" r="16" fill="#ec4899" />
    <circle cx="250" cy="400" r="22" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="250" y="435" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#ec4899" text-anchor="middle">DEPLOYMENT</text>
  </g>

  <!-- QA (TestBot) - Bottom Left -->
  <g class="node-qa">
    <circle cx="120" cy="325" r="16" fill="url(#orange-grad)" />
    <circle cx="120" cy="325" r="22" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="85" y="329" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#f97316" text-anchor="end">TESTING</text>
  </g>

  <!-- Developer (Amelia) - Top Left -->
  <g class="node-dev">
    <circle cx="120" cy="175" r="16" fill="url(#emerald-grad)" />
    <circle cx="120" cy="175" r="22" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="85" y="179" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#10b981" text-anchor="end">CODING</text>
  </g>

  <!-- Core Hub (Orchestrator Central Node) -->
  <g class="core-node">
    <circle cx="250" cy="250" r="32" fill="#0f172a" stroke="#3b82f6" stroke-width="3" />
    <circle cx="250" cy="250" r="42" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="10 6" />
    <!-- Small tech details in core -->
    <polygon points="250,234 264,258 236,258" fill="#3b82f6" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(480, 220)">
    <!-- Main title with linear gradient styling -->
    <text x="0" y="30" class="brand-title">Open<tspan fill="#3b82f6">MAD</tspan></text>
    <!-- Subtitle -->
    <text x="5" y="70" class="brand-subtitle">ORCHESTRATOR</text>
    <!-- Tagline -->
    <text x="5" y="105" class="brand-tagline">Concurrently Spawning &amp; Coordinating Agent Teams</text>
    <!-- Mini tech specs -->
    <rect x="5" y="125" width="105" height="20" rx="4" fill="#1e293b" />
    <text x="12" y="139" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#3b82f6">RUST RUNTIME</text>

    <rect x="120" y="125" width="125" height="20" rx="4" fill="#1e293b" />
    <text x="127" y="139" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10b981">TOKIO SCHEDULER</text>
  </g>
</svg>
